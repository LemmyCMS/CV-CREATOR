<title>Zig Candidate Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* App chrome around the document: follows the viewer's theme */
:root{
  color-scheme: light;
  --ground:#e9ecf0; --surface:#ffffff; --line:#d6dae1; --ink:#11151b; --ink-2:#525b68; --zig:#d9501d; --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme: dark; --ground:#141518; --surface:#1d1f22; --line:#34373c; --ink:#f4f5f6; --ink-2:#b3b8c0; --zig:#f07a4a; --focus:#6da7ec; }
}
:root[data-theme="dark"]{ color-scheme: dark; --ground:#141518; --surface:#1d1f22; --line:#34373c; --ink:#f4f5f6; --ink-2:#b3b8c0; --zig:#f07a4a; --focus:#6da7ec; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--ground); color:var(--ink); font-family:"Public Sans","Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.5}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.bar-in{max-width:900px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between}
.bar b{font-family:Archivo,Arial,sans-serif; font-size:15px}
.bar span{color:var(--ink-2); font-size:12.5px}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:7px; padding:6px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.pages{padding-block:24px 60px; padding-inline:16px; display:flex; flex-direction:column; align-items:center; gap:24px}
.scaler{width:100%; max-width:794px}
.pagelabel{max-width:794px; width:100%; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); font-weight:600; margin-bottom:-14px}

/* ---------- The document: fixed brand colours, A4 ---------- */
.a4{--ink:#15171c; --ink2:#4b5260; --ink3:#8a909c; --line:#e4e6eb; --tint:#f4f5f8; --zig:#d9501d; --zig-soft:#fdeee7;
  --c-front:#2563c9; --c-front-bg:#e8f0fc; --c-test:#0e8a5f; --c-test-bg:#e3f5ed; --c-back:#7446c2; --c-back-bg:#f0eafb; --c-work:#b36b00; --c-work-bg:#fcf1de;
  width:210mm; height:297mm; background:#fff; color:var(--ink); position:relative; overflow:hidden; font-family:"Public Sans","Helvetica Neue",Arial,sans-serif; font-size:10pt; line-height:1.42;
  box-shadow:0 1px 3px rgba(0,0,0,.1),0 18px 50px rgba(0,0,0,.14); transform-origin:top left; display:flex; flex-direction:column; color-scheme:light}
.a4 h1,.a4 h2,.a4 h3{margin:0; font-family:Archivo,Arial,sans-serif; letter-spacing:-.01em}
.a4 [contenteditable="true"]:hover{outline:1px dashed #b9bec8; outline-offset:1px}
.a4 [contenteditable="true"]:focus{outline:2px solid var(--zig); outline-offset:1px}
.ic{width:15px; height:15px; flex:none; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

.top{background:var(--ink); color:#fff; padding:9mm 12mm 8mm; display:flex; justify-content:space-between; align-items:center; gap:10mm}
.logo{display:flex; align-items:center; gap:3mm}
.logo .w{font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:17pt; letter-spacing:.07em; line-height:1}
.logo .w small{display:block; font-family:"Public Sans",Arial,sans-serif; font-size:6.5pt; font-weight:600; letter-spacing:.2em; color:#aab0bb; margin-top:1.2mm}
.top .r{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:1.6mm}
.top .doc{font-size:7.5pt; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:#fff}
.top .type{display:inline-flex; align-items:center; gap:1.5mm; background:var(--zig); color:#fff; font-weight:700; font-size:8pt; padding:1mm 3mm; border-radius:99px}
.top .date{font-size:8pt; color:#aab0bb}
.zz{display:block; width:100%; height:3.2mm; background:var(--ink)}

.hero{padding:6mm 12mm 0; display:flex; justify-content:space-between; align-items:flex-end; gap:8mm}
.hero .who{font-size:8pt; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--zig)}
.hero h1{font-size:27pt; font-weight:800; line-height:1.02; margin-top:1mm; letter-spacing:-.02em}
.hero .tag{font-size:10.5pt; color:var(--ink2); margin-top:1.8mm; font-weight:500}
.seal{flex:none; width:27mm; height:27mm; border-radius:50%; background:var(--zig-soft); border:1.2mm solid var(--zig); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--ink)}
.seal b{font-family:Archivo,Arial,sans-serif; font-size:22pt; font-weight:800; line-height:1}
.seal span{font-size:6.8pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); line-height:1.2; margin-top:.6mm}

.facts{display:grid; grid-template-columns:repeat(4,1fr); gap:3mm; padding:5mm 12mm 0}
.fact{border-radius:2.5mm; padding:2.8mm 3.2mm; display:flex; gap:2.4mm; align-items:flex-start}
.fact .ic{width:17px; height:17px; margin-top:.4mm}
.fact .k{font-size:6.8pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.85}
.fact .v{font-size:10.5pt; font-weight:700; color:var(--ink); line-height:1.25; margin-top:.3mm}
.fact.green{background:var(--c-test-bg); color:var(--c-test)}
.fact.blue{background:var(--c-front-bg); color:var(--c-front)}
.fact.orange{background:var(--zig-soft); color:var(--zig)}
.fact.purple{background:var(--c-back-bg); color:var(--c-back)}
.fact.amber{background:var(--c-work-bg); color:var(--c-work)}

.cols{display:grid; grid-template-columns:1fr 70mm; gap:8mm; padding:5mm 12mm 0; flex:1; min-height:0}
.h{font-size:7.5pt; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--ink); display:flex; align-items:center; gap:2.5mm; margin:0 0 2.8mm; font-family:Archivo,Arial,sans-serif}
.h::before{content:""; width:3.4mm; height:3.4mm; flex:none; background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cpolyline points=%274,6 36,6 4,34 36,34%27 fill=%27none%27 stroke=%27%23d9501d%27 stroke-width=%278%27/%3E%3C/svg%3E") center/contain no-repeat}
.h::after{content:""; flex:1; height:.3mm; background:var(--line)}
.sec + .sec{margin-top:4.2mm}

.why{list-style:none; margin:0; padding:0; display:grid; gap:1.8mm}
.why li{display:grid; grid-template-columns:5.2mm 1fr; gap:2.4mm; align-items:start; font-size:9.5pt}
.why .ck{width:5.2mm; height:5.2mm; border-radius:50%; background:var(--zig); color:#fff; display:grid; place-items:center; margin-top:.2mm}
.why .ck .ic{width:11px; height:11px; stroke-width:3}
.why b{font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:1.6mm; margin-top:3.4mm}
.chip{font-size:7.8pt; font-weight:600; padding:.7mm 2.4mm; border-radius:99px; background:var(--tint); color:var(--ink2); border:.25mm solid var(--line)}

.tl{position:relative; display:grid; gap:2.8mm}
.tl::before{content:""; position:absolute; left:1.6mm; top:1.5mm; bottom:1.5mm; width:.5mm; background:var(--line)}
.job{position:relative; padding-left:7mm}
.job::before{content:""; position:absolute; left:0; top:1.1mm; width:3.7mm; height:3.7mm; border-radius:50%; background:#fff; border:.9mm solid var(--zig)}
.job.prev::before{border-color:var(--ink3)}
.job .t{display:flex; justify-content:space-between; gap:3mm; align-items:baseline}
.job .role{font-family:Archivo,Arial,sans-serif; font-weight:700; font-size:10.5pt}
.job .per{font-family:"IBM Plex Mono",monospace; font-size:8pt; color:var(--ink2); white-space:nowrap; background:var(--tint); padding:0 1.6mm; border-radius:1mm}
.job .org{font-size:8.5pt; color:var(--ink2); font-weight:600}
.job p{margin:1mm 0 0; font-size:9pt; color:var(--ink)}
.job .tags{display:flex; flex-wrap:wrap; gap:1.2mm; margin-top:1.4mm}
.job .tags span{font-family:"IBM Plex Mono",monospace; font-size:7.2pt; background:var(--tint); color:var(--ink2); padding:.2mm 1.6mm; border-radius:.8mm}
.job .prevtag{display:inline-block; font-size:6.8pt; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); margin-left:1.5mm}

.side{display:flex; flex-direction:column}
.sg + .sg{margin-top:2.2mm}
.sg .gh{display:flex; align-items:center; gap:1.8mm; font-size:7.5pt; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:1.3mm}
.sg .gh i{width:2.4mm; height:2.4mm; border-radius:.6mm}
.sk{display:flex; justify-content:space-between; align-items:center; gap:2mm; padding:.35mm 0; border-bottom:.25mm dotted var(--line); font-size:9pt}
.sk:last-child{border-bottom:0}
.sk .n{font-weight:600}
.stars{display:inline-flex; gap:.5mm; flex:none; cursor:pointer}
.stars svg{width:10.5px; height:10.5px}
.stars .on{fill:var(--zig)}
.stars .off{fill:#e2e4e9}
.legend{margin-top:1.8mm; font-size:6.6pt; color:var(--ink3); line-height:1.5}
.legend b{color:var(--ink2); font-weight:600}
.lang{display:flex; justify-content:space-between; align-items:center; padding:.4mm 0; font-size:9pt}
.lang .n{font-weight:600}
.lang .n small{font-weight:400; color:var(--ink2); margin-left:1.2mm; font-size:8pt}
.dots{display:inline-flex; gap:.9mm}
.dots i{width:2.3mm; height:2.3mm; border-radius:50%; background:#e2e4e9}
.dots i.on{background:var(--c-back)}
.edu{display:grid; grid-template-columns:5mm 1fr; gap:2mm; font-size:8.8pt; padding:.4mm 0}
.edu .ic{color:var(--ink2); width:14px; height:14px; margin-top:.4mm}
.edu b{display:block; font-weight:700; line-height:1.3}
.edu span{color:var(--ink2); font-size:8pt}

.foot{margin-top:auto; background:var(--tint); border-top:.4mm solid var(--zig); padding:3.8mm 12mm; display:flex; justify-content:space-between; align-items:center; gap:6mm; font-size:8.5pt}
.foot .c{display:flex; gap:3mm; align-items:center}
.foot .c .k{font-size:6.8pt; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.foot .c b{font-weight:700}
.foot .fill{background:#fff6c7; border-radius:1mm; padding:0 1mm}
.foot .r{text-align:right; color:var(--ink2); font-size:7.8pt; max-width:72mm}

/* page 2: the candidate's own CV, anonymised */
.a4.orig{display:block}
.a4.orig img{display:block; width:100%; height:100%; object-fit:contain}
.origtag{position:absolute; top:5mm; left:6mm; display:flex; align-items:center; gap:2mm; background:var(--ink); color:#fff; font-size:7pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:1.3mm 3mm 1.3mm 1.6mm; border-radius:99px}
.plain{padding:22mm 18mm 16mm; font-family:Georgia,"Times New Roman",serif; font-size:10pt; color:#222; line-height:1.5}
.plain h2{font-family:Georgia,serif; font-size:20pt; letter-spacing:.04em; margin:0}
.plain h3{font-family:Georgia,serif; font-size:11pt; text-transform:uppercase; letter-spacing:.1em; color:#8a4b32; margin:6mm 0 2mm; border-bottom:.3mm solid #ddd; padding-bottom:1mm}
.plain p{margin:0 0 2mm}
.plain ul{margin:0 0 2mm; padding-left:5mm}
.plain .redacted{background:#f3f3f3; color:#777; font-family:Arial,sans-serif; font-size:8.5pt; padding:2mm 3mm; border-left:1mm solid #d9501d}

@media print{
  @page{size:A4; margin:0}
  body{background:#fff}
  .bar,.pagelabel{display:none!important}
  .pages{padding:0; gap:0}
  .scaler{max-width:none; height:auto!important}
  .a4{box-shadow:none; transform:none!important; break-after:page}
}
</style>

<div class="bar"><div class="bar-in">
  <div><b>Zig candidate presentation</b> <span>· Click any text to edit it. Click the stars to re-rate a skill.</span></div>
  <div style="display:flex; gap:8px"><button class="btn" type="button" id="dl" hidden>Save .html</button></div>
</div></div>

<div class="pages" id="pages"></div>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICONS = {
  euro:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5a4.2 4.2 0 1 0 0 7M7 10.6h6.5M7 13.4h6.5"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  chat:'<path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  pin:'<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12.5h18"/>',
  check:'<polyline points="5.5 12.5 10 17 18.5 7.5"/>',
  cap:'<path d="M2 9.5 12 5l10 4.5-10 4.5z"/><path d="M6 11.5V16c3.5 2.4 8.5 2.4 12 0v-4.5M22 9.5v5"/>',
  badge:'<circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5 7 21l5-2.5 5 2.5-1.5-7.5"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 4.5-6.5 8-6.5s6.5 2 8 6.5"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.check}</svg>`;
const STAR = 'M12 2.6l2.85 6 6.55.8-4.85 4.55 1.28 6.5L12 17.2l-5.83 3.25 1.28-6.5L2.6 9.4l6.55-.8z';
const stars = n => `<span class="stars" role="img" aria-label="${n} of 5">${[1,2,3,4,5].map(i => `<svg viewBox="0 0 24 24" data-i="${i}"><path class="${i <= n ? "on" : "off"}" d="${STAR}"/></svg>`).join("")}</span>`;
const LOGO = (s, bg, fg) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="${bg}"/><polyline points="9,12 31,12 9,28 31,28" fill="none" stroke="${fg}" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="square"/></svg>`;
const ZZ = `<svg class="zz" viewBox="0 0 400 12" preserveAspectRatio="none" aria-hidden="true"><rect width="400" height="12" fill="#15171c"/><polyline points="${Array.from({length:81},(_,i)=>`${i*5},${i%2?2:10}`).join(" ")}" fill="none" stroke="#d9501d" stroke-width="1.4"/></svg>`;
const CE = ' contenteditable="true" spellcheck="false"';
const GROUP = { front:"var(--c-front)", test:"var(--c-test)", back:"var(--c-back)", work:"var(--c-work)" };

function page1(){
  return `<article class="a4" aria-label="Candidate presentation, page 1">
  <header class="top">
    <div class="logo">${LOGO(40, "#d9501d", "#15171c")}<div class="w">THE ZIG<small>RECRUITMENT · BELGIUM</small></div></div>
    <div class="r"><span class="doc">Candidate presentation</span><span class="type"${CE}>${esc(D.type)}</span><span class="date"${CE}>${esc(D.date)}${D.ref ? " · " + esc(D.ref) : ""}</span></div>
  </header>
  ${ZZ}
  <section class="hero">
    <div>
      <div class="who"${CE}>${esc(D.firstName)}</div>
      <h1${CE}>${esc(D.role)}</h1>
      <div class="tag"${CE}>${esc(D.tagline)}</div>
    </div>
    <div class="seal"><b${CE}>${esc(D.years)}</b><span>years<br>experience</span></div>
  </section>
  <section class="facts">${D.facts.map(f => `<div class="fact ${esc(f.color)}">${icon(f.icon)}<div><div class="k">${esc(f.label)}</div><div class="v"${CE}>${esc(f.value)}</div></div></div>`).join("")}</section>
  <div class="cols">
    <div>
      <section class="sec"><h2 class="h">Why ${esc(D.firstName)}</h2>
        <ul class="why">${D.highlights.map(h => `<li><span class="ck">${icon("check")}</span><span${CE}>${h}</span></li>`).join("")}</ul>
        ${D.softSkills?.length ? `<div class="chips">${D.softSkills.map(s => `<span class="chip"${CE}>${esc(s)}</span>`).join("")}</div>` : ""}
      </section>
      <section class="sec"><h2 class="h">Experience</h2>
        <div class="tl">${D.experience.map(j => `<div class="job${j.previous ? " prev" : ""}">
          <div class="t"><span class="role"${CE}>${esc(j.role)}</span><span class="per"${CE}>${esc(j.period)}</span></div>
          <div class="org"><span${CE}>${esc(j.org)}</span>${j.previous ? `<span class="prevtag">Previous career</span>` : ""}</div>
          <p${CE}>${esc(j.text)}</p>
          ${j.tags?.length ? `<div class="tags">${j.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
        </div>`).join("")}</div>
      </section>
    </div>
    <aside class="side">
      <section class="sec"><h2 class="h">Skills</h2>
        ${D.skills.map((g, gi) => `<div class="sg"><div class="gh" style="color:${GROUP[g.color]}"><i style="background:${GROUP[g.color]}"></i>${esc(g.group)}</div>
          ${g.items.map((s, si) => `<div class="sk"><span class="n"${CE}>${esc(s.name)}</span><span data-g="${gi}" data-s="${si}">${stars(s.stars)}</span></div>`).join("")}</div>`).join("")}
        <div class="legend"><b>★★★★★</b> expert, leads others · <b>★★★★</b> advanced, daily use · <b>★★★</b> solid · <b>★★</b> working knowledge · <b>★</b> familiar. Consultant assessment.</div>
      </section>
      <section class="sec"><h2 class="h">Languages</h2>
        ${D.languages.map(l => `<div class="lang"><span class="n">${esc(l.name)}<small${CE}>${esc(l.level)}</small></span><span class="dots">${[1,2,3,4,5].map(i => `<i class="${i <= l.dots ? "on" : ""}"></i>`).join("")}</span></div>`).join("")}
      </section>
      <section class="sec"><h2 class="h">Education</h2>
        ${D.education.map(e => `<div class="edu">${icon(e.icon || "cap")}<div><b${CE}>${esc(e.title)}</b><span${CE}>${esc(e.detail)}</span></div></div>`).join("")}
      </section>
    </aside>
  </div>
  <footer class="foot">
    <div class="c">${LOGO(26, "#15171c", "#d9501d")}<div><div class="k">Your Zig consultant</div><b${CE}>${esc(D.consultant.name)}</b> · <span${CE}>${esc(D.consultant.email)}</span> · <span${CE}>${esc(D.consultant.phone)}</span></div></div>
    <div class="r">Candidate contact details are held by The Zig. Full anonymised CV attached on the following page.</div>
  </footer>
</article>`;
}

function page2(){
  const a = D.appendix || {};
  const tag = `<div class="origtag">${LOGO(14, "#d9501d", "#15171c")}Original CV · anonymised</div>`;
  if (a.kind === "image") return `<article class="a4 orig" aria-label="Original CV, anonymised"><img src="${a.src}" alt="Candidate's original CV with personal contact details removed">${tag}</article>`;
  return `<article class="a4 orig" aria-label="Original CV, anonymised"><div class="plain">${a.html || ""}</div>${tag}</article>`;
}

function render(){
  const pages = document.getElementById("pages");
  pages.innerHTML = `<div class="pagelabel">Page 1 · Zig presentation</div><div class="scaler">${page1()}</div><div class="pagelabel">Page 2 · Candidate's own CV, anonymised</div><div class="scaler">${page2()}</div>`;
  fit();
}
/* scale the A4 sheets down to the viewport on small screens */
function fit(){
  document.querySelectorAll(".scaler").forEach(sc => {
    const sheet = sc.firstElementChild; const full = 793.7;
    const s = Math.min(1, sc.clientWidth / full);
    sheet.style.transform = s < 1 ? `scale(${s})` : "";
    sc.style.height = s < 1 ? (1122.5 * s) + "px" : "";
  });
}
addEventListener("resize", fit);

document.addEventListener("click", e => {
  const svg = e.target.closest(".stars svg"); if (!svg) return;
  const holder = svg.closest("[data-g]");
  const n = +svg.dataset.i, g = +holder.dataset.g, s = +holder.dataset.s;
  const item = D.skills[g].items[s];
  item.stars = item.stars === n ? n - 1 : n;
  holder.innerHTML = stars(item.stars);
});

render();

(async () => {
  const downloads = await (window.claude?.use ? window.claude.use("downloads") : Promise.resolve(null));
  if (!downloads) return;
  const b = document.getElementById("dl"); b.hidden = false;
  b.onclick = async () => {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
    const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The Zig · ${esc(D.firstName)} · ${esc(D.role)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>${css}</style></head><body><div class="pages">${[...document.querySelectorAll(".scaler")].map(s => s.innerHTML.replace(/ contenteditable="true" spellcheck="false"/g, "").replace(/style="transform:[^"]*"/g, "")).join("")}</div></body></html>`;
    try { const r = await downloads.save({ filename: `zig-presentation_${D.firstName}_${D.role}.html`.replace(/[^\w.-]+/g, "-"), data: new Blob([html], { type: "text/html" }) }); if (r.status === "saved") { b.textContent = "Saved"; setTimeout(() => b.textContent = "Save .html", 1800); } }
    catch (err) { if (err && err.code === "unavailable") b.hidden = true; }
  };
})();
</script>
