<title>Zig Candidate Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Libre+Franklin:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* App chrome around the document: follows the viewer's theme */
:root{
  color-scheme: light;
  --ground:#e9eaec; --surface:#ffffff; --line:#d5d7db; --ink:#15171c; --ink-2:#5b6068; --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme: dark; --ground:#141518; --surface:#1d1f22; --line:#34373c; --ink:#f4f5f6; --ink-2:#b3b8c0; --focus:#6da7ec; }
}
:root[data-theme="dark"]{ color-scheme: dark; --ground:#141518; --surface:#1d1f22; --line:#34373c; --ink:#f4f5f6; --ink-2:#b3b8c0; --focus:#6da7ec; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--ground); color:var(--ink); font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.5}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.bar-in{max-width:900px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between}
.bar b{font-size:15px}
.bar span{color:var(--ink-2); font-size:12.5px}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:7px; padding:6px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.pages{padding-block:24px 60px; padding-inline:16px; display:flex; flex-direction:column; align-items:center; gap:24px}
.scaler{width:100%; max-width:794px}
.pagelabel{max-width:794px; width:100%; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); font-weight:600; margin-bottom:-14px}

/* ---------- The document. Three colours only: ink, Zig orange, one grey. ---------- */
.a4{--k:#15171c; --o:#d9501d; --g:#8b8f96;
  width:210mm; height:297mm; background:#fff; color:var(--k); position:relative; overflow:hidden; color-scheme:light;
  font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif; font-size:12.5pt; line-height:1.45;
  box-shadow:0 1px 3px rgba(0,0,0,.1),0 18px 50px rgba(0,0,0,.14); transform-origin:top left; display:flex; flex-direction:column; padding:0 16mm}
.a4 [contenteditable="true"]:hover{outline:1px dashed var(--g); outline-offset:2px}
.a4 [contenteditable="true"]:focus{outline:2px solid var(--o); outline-offset:2px}

.mast{display:flex; justify-content:space-between; align-items:center; padding:10mm 0 4mm; border-bottom:.6mm solid var(--k)}
.logo{display:flex; align-items:center; gap:2.6mm; font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:15pt; letter-spacing:.06em}
.mast .meta{font-size:10pt; color:var(--g); text-align:right}
.mast .meta b{color:var(--o); font-weight:700}

.kicker{margin-top:9mm; font-size:10.5pt; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--o)}
.head{font-family:Newsreader,Georgia,"Times New Roman",serif; font-weight:600; font-size:36pt; line-height:1.05; letter-spacing:-.01em; margin:2mm 0 0; text-wrap:balance}
.deck{font-size:14.5pt; line-height:1.4; margin:4mm 0 0; color:var(--k); max-width:160mm}

.facts{display:grid; grid-template-columns:repeat(4,1fr); margin-top:8mm; border-top:.3mm solid var(--g); border-bottom:.3mm solid var(--g)}
.facts > div{padding:3.5mm 3mm 3.5mm 0}
.facts > div + div{padding-left:4mm; border-left:.3mm solid var(--g)}
.facts .l{font-size:9.5pt; color:var(--g); font-weight:600}
.facts .v{font-size:15pt; font-weight:700; line-height:1.2; margin-top:.5mm}

.h{font-size:10.5pt; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:9mm 0 3mm; color:var(--k)}
.can{list-style:none; margin:0; padding:0; display:grid; gap:2.6mm}
.can li{display:grid; grid-template-columns:6mm 1fr; align-items:baseline}
.can li::before{content:"✓"; color:var(--o); font-weight:800; font-size:13pt}

.two{display:grid; grid-template-columns:1fr 1fr; gap:12mm}
.sk{display:flex; justify-content:space-between; align-items:center; padding:1.3mm 0; border-bottom:.3mm solid #e6e7e9}
.sk:last-of-type{border-bottom:0}
.sk span:first-child{font-weight:600}
.stars{display:inline-flex; gap:.6mm; cursor:pointer; flex:none}
.stars svg{width:14px; height:14px}
.stars .on{fill:var(--o)}
.stars .off{fill:none; stroke:var(--g); stroke-width:1.4}
.key{font-size:9pt; color:var(--g); margin-top:2mm}
.job{padding:1.3mm 0 2.4mm; border-bottom:.3mm solid #e6e7e9}
.job:last-child{border-bottom:0}
.job .y{font-size:10pt; font-weight:700; color:var(--o)}
.job.prev .y{color:var(--g)}
.job .r{font-weight:700; line-height:1.3}
.job .o{color:var(--g); font-size:11pt}

.line{margin-top:6mm; font-size:11.5pt}
.line b{font-size:10.5pt; letter-spacing:.14em; text-transform:uppercase; margin-right:2mm}

.foot{margin-top:auto; padding:5mm 0 9mm; border-top:.6mm solid var(--k); display:flex; justify-content:space-between; gap:6mm; font-size:10.5pt}
.foot .who b{display:block; font-size:12pt}
.foot .who span{color:var(--g)}
.foot .note{color:var(--g); text-align:right; max-width:78mm; font-size:9.5pt}

/* page 2: the candidate's own CV, anonymised */
.a4.orig{display:block; padding:0}
.a4.orig img{display:block; width:100%; height:100%; object-fit:contain}
.origtag{position:absolute; top:5mm; left:6mm; display:flex; align-items:center; gap:2mm; background:#15171c; color:#fff; font-size:7pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:1.3mm 3mm 1.3mm 1.6mm; border-radius:99px}
.plain{padding:22mm 18mm 16mm; font-family:Georgia,"Times New Roman",serif; font-size:10pt; color:#222; line-height:1.5}
.plain h2{font-family:Georgia,serif; font-size:20pt; letter-spacing:.04em; margin:0}
.plain h3{font-family:Georgia,serif; font-size:11pt; text-transform:uppercase; letter-spacing:.1em; color:#8a4b32; margin:6mm 0 2mm; border-bottom:.3mm solid #ddd; padding-bottom:1mm}
.plain p{margin:0 0 2mm}
.plain ul{margin:0 0 2mm; padding-left:5mm}
.plain .redacted{background:#f3f3f3; color:#777; font-family:Arial,sans-serif; font-size:8.5pt; padding:2mm 3mm; border-left:1mm solid #d9501d}

@media print{
  @page{size:A4; margin:0}
  body{background:#fff}
  .bar,.pagelabel{display:none!important}
  .pages{padding:0; gap:0}
  .scaler{max-width:none; height:auto!important}
  .a4{box-shadow:none; transform:none!important; break-after:page}
}
</style>

<div class="bar"><div class="bar-in">
  <div><b>Zig candidate presentation</b> <span>· Click any text to edit it. Click the stars to re-rate a skill.</span></div>
  <div style="display:flex; gap:8px"><button class="btn" type="button" id="dl" hidden>Save .html</button></div>
</div></div>

<div class="pages" id="pages"></div>

<script type="application/json" id="data">
{
  "type": "Permanent",
  "date": "September 2026",
  "firstName": "Sofia",
  "role": "Data Engineer",
  "deck": "Builds the systems that collect a company's data and make it ready for reports. Seven years of experience, most recently at a Belgian insurer.",
  "facts": [
    {"l":"Salary + car","v":"€68–72k"},
    {"l":"Can start","v":"In 2 months"},
    {"l":"Interviews","v":"Tue & Thu"},
    {"l":"Languages","v":"NL · EN · FR"}
  ],
  "can": [
    "Built an insurer's new data platform on Azure, replacing 140 old jobs.",
    "Made the nightly data load 7 times faster: from 6 hours to 50 minutes.",
    "Checks data quality automatically, so reports can be trusted.",
    "Talks the language of finance teams after 3 years as a BI analyst."
  ],
  "skills": [
    {"name":"Azure Databricks","stars":5},
    {"name":"Python","stars":5},
    {"name":"SQL","stars":5},
    {"name":"Azure Data Factory","stars":4},
    {"name":"Power BI","stars":4},
    {"name":"CI/CD","stars":3}
  ],
  "experience": [
    {"y":"2021 – now","r":"Senior Data Engineer","o":"Insurance group, Brussels"},
    {"y":"2019 – 2021","r":"Data Engineer","o":"Energy supplier, Antwerp"},
    {"y":"2016 – 2019","r":"BI Analyst","o":"Retail chain, Ghent","prev":true}
  ],
  "education": "MSc Business Engineering · Databricks Data Engineer Professional (2024)",
  "consultant": {"name":"[Consultant name]","contact":"[email]@thezig.io · [phone]"},
  "appendix": {"kind":"html","html":"<h2>SOFIA</h2><p><i>Data Engineer</i></p><div class='redacted'>Contact details, address and date of birth removed by The Zig. Contact via your Zig consultant.</div><h3>Profile</h3><p>Data engineer with seven years of experience, three of them in BI. I like building platforms that analysts trust.</p><h3>Experience</h3><p><b>Insurance group, Brussels</b> · Senior Data Engineer · 2021 – now</p><ul><li>Designed and built the Azure Databricks platform replacing 140 SSIS packages</li><li>Moved nightly loads to incremental Delta Lake, 6 h → 50 min</li><li>Introduced Great Expectations tests and lineage for 300+ pipelines</li><li>Mentoring two junior engineers</li></ul><p><b>Energy supplier, Antwerp</b> · Data Engineer · 2019 – 2021</p><ul><li>Smart-meter ingestion, 40M rows a day, Python and Azure Synapse</li><li>Reporting warehouse on SQL Server</li></ul><p><b>Retail chain, Ghent</b> · BI Analyst · 2016 – 2019</p><ul><li>Power BI dashboards for finance and store operations</li></ul><h3>Education</h3><p>MSc Business Engineering</p><h3>Certifications</h3><p>Databricks Certified Data Engineer Professional (2024) · Azure Data Engineer Associate DP-203 (2022)</p><h3>Languages</h3><p>Dutch (native), English (fluent), French (good)</p><h3>Interests</h3><p>Cycling, board games, volunteering at a coding school</p>"}
}
</script>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAR = 'M12 2.6l2.85 6 6.55.8-4.85 4.55 1.28 6.5L12 17.2l-5.83 3.25 1.28-6.5L2.6 9.4l6.55-.8z';
const stars = n => `<span class="stars" role="img" aria-label="${n} of 5">${[1,2,3,4,5].map(i => `<svg viewBox="0 0 24 24" data-i="${i}"><path class="${i <= n ? "on" : "off"}" d="${STAR}"/></svg>`).join("")}</span>`;
const LOGO = (s, bg, fg) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="${bg}"/><polyline points="9,12 31,12 9,28 31,28" fill="none" stroke="${fg}" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="square"/></svg>`;
const CE = ' contenteditable="true" spellcheck="false"';

function page1(){
  return `<article class="a4" aria-label="Candidate presentation, page 1">
  <header class="mast">
    <div class="logo">${LOGO(30, "#15171c", "#d9501d")}THE ZIG</div>
    <div class="meta">Candidate presentation · <b${CE}>${esc(D.type)}</b><br><span${CE}>${esc(D.date)}</span></div>
  </header>
  <div class="kicker"${CE}>${esc(D.firstName)}</div>
  <h1 class="head"${CE}>${esc(D.role)}</h1>
  <p class="deck"${CE}>${esc(D.deck)}</p>
  <div class="facts">${D.facts.map(f => `<div><div class="l">${esc(f.l)}</div><div class="v"${CE}>${esc(f.v)}</div></div>`).join("")}</div>
  <h2 class="h">What ${esc(D.firstName)} can do</h2>
  <ul class="can">${D.can.map(c => `<li${CE}>${esc(c)}</li>`).join("")}</ul>
  <div class="two">
    <section><h2 class="h">Skills</h2>
      ${D.skills.map((s, i) => `<div class="sk"><span${CE}>${esc(s.name)}</span><span data-s="${i}">${stars(s.stars)}</span></div>`).join("")}
      <div class="key">5 stars: expert · 3 stars: solid · 1 star: basic</div>
    </section>
    <section><h2 class="h">Experience</h2>
      ${D.experience.map(j => `<div class="job${j.prev ? " prev" : ""}"><div class="y"${CE}>${esc(j.y)}</div><div class="r"${CE}>${esc(j.r)}</div><div class="o"${CE}>${esc(j.o)}</div></div>`).join("")}
    </section>
  </div>
  <p class="line"><b>Education</b><span${CE}>${esc(D.education)}</span></p>
  <footer class="foot">
    <div class="who"><span>Your Zig consultant</span><b${CE}>${esc(D.consultant.name)}</b><span${CE}>${esc(D.consultant.contact)}</span></div>
    <div class="note">Contact details are held by The Zig. The full CV, anonymised, is on the next page.</div>
  </footer>
</article>`;
}

function page2(){
  const a = D.appendix || {};
  const tag = `<div class="origtag">${LOGO(14, "#d9501d", "#15171c")}Original CV · anonymised</div>`;
  if (a.kind === "image") return `<article class="a4 orig" aria-label="Original CV, anonymised"><img src="${a.src}" alt="Candidate's original CV with personal contact details removed">${tag}</article>`;
  return `<article class="a4 orig" aria-label="Original CV, anonymised"><div class="plain">${a.html || ""}</div>${tag}</article>`;
}

function render(){
  document.getElementById("pages").innerHTML = `<div class="pagelabel">Page 1 · Zig presentation</div><div class="scaler">${page1()}</div><div class="pagelabel">Page 2 · Candidate's own CV, anonymised</div><div class="scaler">${page2()}</div>`;
  fit();
}
/* scale the A4 sheets down to the viewport on small screens */
function fit(){
  document.querySelectorAll(".scaler").forEach(sc => {
    const sheet = sc.firstElementChild;
    const s = Math.min(1, sc.clientWidth / 793.7);
    sheet.style.transform = s < 1 ? `scale(${s})` : "";
    sc.style.height = s < 1 ? (1122.5 * s) + "px" : "";
  });
}
addEventListener("resize", fit);

document.addEventListener("click", e => {
  const svg = e.target.closest(".stars svg"); if (!svg) return;
  const holder = svg.closest("[data-s]");
  const item = D.skills[+holder.dataset.s], n = +svg.dataset.i;
  item.stars = item.stars === n ? n - 1 : n;
  holder.innerHTML = stars(item.stars);
});

render();

(async () => {
  const downloads = await (window.claude?.use ? window.claude.use("downloads") : Promise.resolve(null));
  if (!downloads) return;
  const b = document.getElementById("dl"); b.hidden = false;
  b.onclick = async () => {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
    const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The Zig · ${esc(D.firstName)} · ${esc(D.role)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Libre+Franklin:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"><style>${css}</style></head><body><div class="pages">${[...document.querySelectorAll(".scaler")].map(s => s.innerHTML.replace(/ contenteditable="true" spellcheck="false"/g, "").replace(/style="transform:[^"]*"/g, "")).join("")}</div></body></html>`;
    try { const r = await downloads.save({ filename: `zig-presentation_${D.firstName}_${D.role}.html`.replace(/[^\w.-]+/g, "-"), data: new Blob([html], { type: "text/html" }) }); if (r.status === "saved") { b.textContent = "Saved"; setTimeout(() => b.textContent = "Save .html", 1800); } }
    catch (err) { if (err && err.code === "unavailable") b.hidden = true; }
  };
})();
</script>
