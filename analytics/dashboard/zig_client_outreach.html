<title>Zig Client Prospector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --line:#dcdfe5; --line-soft:#e9ebef;
  --ink:#11151b; --ink-2:#525b68; --ink-3:#747d8b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0f7a53; --warn:#9a5c00; --crit:#b3261e; --info:#1f63b5; --neutral:#5f6875;
  --good-bg:#e4f4ec; --warn-bg:#fbf0dc; --crit-bg:#fbe6e4; --info-bg:#e3eefb; --neutral-bg:#eceef1;
  --good-mk:#0ca30c; --warn-mk:#e8a200; --crit-mk:#d03b3b; --info-mk:#2a78d6; --neutral-mk:#9aa2ad;
  --seq-1:#86b6ef; --seq-2:#5598e7; --seq-3:#2a78d6; --seq-4:#1c5cab;
  --ai:#5a47c2; --ai-bg:#eeebfb;
  --focus:#2a78d6; --shadow:0 1px 2px rgba(17,21,27,.06),0 8px 24px rgba(17,21,27,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#111214; --surface:#1a1a19; --surface-2:#212223; --line:#33353a; --line-soft:#282a2e;
    --ink:#f4f5f6; --ink-2:#b3b8c0; --ink-3:#8d949e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#4bbd8c; --warn:#e0a13c; --crit:#f08b83; --info:#7fb2f0; --neutral:#98a0ac;
    --good-bg:#16302a; --warn-bg:#332711; --crit-bg:#3a1e1c; --info-bg:#172a42; --neutral-bg:#26282c;
    --good-mk:#0ca30c; --warn-mk:#fab219; --crit-mk:#e66767; --info-mk:#3987e5; --neutral-mk:#6b727c;
    --seq-1:#184f95; --seq-2:#256abf; --seq-3:#3987e5; --seq-4:#86b6ef;
    --ai:#a99cf2; --ai-bg:#27223f;
    --focus:#6da7ec; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#111214; --surface:#1a1a19; --surface-2:#212223; --line:#33353a; --line-soft:#282a2e;
  --ink:#f4f5f6; --ink-2:#b3b8c0; --ink-3:#8d949e;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#4bbd8c; --warn:#e0a13c; --crit:#f08b83; --info:#7fb2f0; --neutral:#98a0ac;
  --good-bg:#16302a; --warn-bg:#332711; --crit-bg:#3a1e1c; --info-bg:#172a42; --neutral-bg:#26282c;
  --good-mk:#0ca30c; --warn-mk:#fab219; --crit-mk:#e66767; --info-mk:#3987e5; --neutral-mk:#6b727c;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#3987e5; --seq-4:#86b6ef;
  --ai:#a99cf2; --ai-bg:#27223f;
  --focus:#6da7ec; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,"Public Sans",Arial,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.012em}
.num,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{padding:0 10px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:12px}
.brand .eyebrow{margin-bottom:4px}
.brand h1{font-size:18px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--info-bg);color:var(--info);font-weight:600}
.nav .step{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);width:28px;display:inline-block;white-space:nowrap}
.nav button > span:first-child{white-space:nowrap}
.nav .cnt{font-size:11px;font-family:"IBM Plex Mono",monospace;padding:0 6px;border-radius:9px;background:var(--neutral-bg);color:var(--ink-2)}
.nav .cnt.crit{background:var(--crit-bg);color:var(--crit)}
.nav .cnt.warn{background:var(--warn-bg);color:var(--warn)}
.nav .cnt.good{background:var(--good-bg);color:var(--good)}
.nav-sep{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:14px 10px 4px}
.legend-box{margin:18px 4px 0;padding:12px;border-radius:8px;background:var(--surface-2);font-size:12px;display:flex;flex-direction:column;gap:6px}
.legend-box b{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.legend-row{display:flex;gap:8px;align-items:center;color:var(--ink-2)}

.main{padding:22px 28px 80px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.topbar h2{font-size:24px;font-weight:700}
.topbar p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sample{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:12px;font-weight:500}

/* status atoms */
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.good{background:var(--good-mk)}.dot.warn{background:var(--warn-mk)}.dot.crit{background:var(--crit-mk)}.dot.info{background:var(--info-mk)}.dot.neutral{background:var(--neutral-mk)}.dot.ai{background:var(--ai)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 8px;border-radius:11px;white-space:nowrap;line-height:18px}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.neutral{background:var(--neutral-bg);color:var(--neutral)}.pill.ai{background:var(--ai-bg);color:var(--ai)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
.chip.sig{border-color:transparent;background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h3{font-size:15px;font-weight:600}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head .sub{color:var(--ink-3);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--neutral-mk)}
.kpi.good::before{background:var(--good-mk)}.kpi.warn::before{background:var(--warn-mk)}.kpi.crit::before{background:var(--crit-mk)}.kpi.info::before{background:var(--info-mk)}
.kpi .k{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.kpi .v{font-family:Archivo,sans-serif;font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--ink-3);font-weight:500;font-family:"Public Sans",sans-serif;letter-spacing:0}
.kpi .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.meter{height:6px;border-radius:3px;background:var(--line-soft);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--info-mk)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--line-soft);background:var(--surface-2)}
.alert.crit{background:var(--crit-bg);border-color:transparent}
.alert.warn{background:var(--warn-bg);border-color:transparent}
.alert.good{background:var(--good-bg);border-color:transparent}
.alert.info{background:var(--info-bg);border-color:transparent}
.alert .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;font-family:Archivo,sans-serif}
.alert.crit .ic{background:var(--crit-mk)}.alert.warn .ic{background:var(--warn-mk);color:#1a1300}.alert.good .ic{background:var(--good-mk)}.alert.info .ic{background:var(--info-mk)}
.alert .t{font-weight:600;font-size:13.5px}
.alert .m{font-size:12.5px;color:var(--ink-2)}
.alert.crit .t{color:var(--crit)}.alert.warn .t{color:var(--warn)}.alert.good .t{color:var(--good)}.alert.info .t{color:var(--info)}

.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--info-mk);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good-mk);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--info)}
.btn.sm{padding:3px 9px;font-size:12px}

/* workflow rail */
.rail{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.rail-step{background:var(--surface-2);border-radius:8px;padding:10px 10px 12px;position:relative;border:1px solid var(--line-soft);cursor:pointer;text-align:left}
.rail-step:hover{border-color:var(--info-mk)}
.rail-step .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.rail-step .nm{font-weight:600;font-size:12.5px;line-height:1.25;margin:2px 0 6px;min-height:32px}
.rail-step .c{font-family:Archivo,sans-serif;font-size:20px;font-weight:700}
.rail-step .u{font-size:11px;color:var(--ink-3)}
.rail-step .flag{position:absolute;top:9px;right:9px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td .co{font-weight:600}
td .meta{font-size:12px;color:var(--ink-3)}
td.num{white-space:nowrap}
.r{text-align:right}
.fit{display:flex;align-items:center;gap:8px;min-width:110px}
.fit .bar{flex:1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.fit .bar i{display:block;height:100%}
.fit .num{font-size:12.5px;font-weight:500;width:24px;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line-soft)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--info-bg);color:var(--info);font-weight:600}
select,input[type="text"],input[type="number"],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
textarea{width:100%;resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow:auto;box-shadow:var(--shadow);padding:22px 22px calc(40px + env(safe-area-inset-bottom,0px));padding-top:calc(22px + env(safe-area-inset-top,0px))}
.drawer h3{font-size:20px}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0}
.sect{margin-top:20px}
.sect > h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.brk{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px}
.brk .bar{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.brk .bar i{display:block;height:100%;background:var(--seq-3);border-radius:4px}
.person{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.av{width:34px;height:34px;border-radius:50%;background:var(--neutral-bg);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink-2)}
.ai-box{background:var(--ai-bg);border-radius:8px;padding:12px 14px;font-size:13px}
.ai-box .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ai);margin-bottom:4px}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:17px}

/* sequence */
.seq-list{display:flex;flex-direction:column;gap:8px}
.seq-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);text-align:left;width:100%}
.seq-card[aria-pressed="true"]{border-color:var(--info-mk);box-shadow:0 0 0 1px var(--info-mk)}
.seq-card .nm{font-weight:600}
.seq-card .st{display:flex;gap:12px;font-size:12px;color:var(--ink-3);margin-top:4px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:0;position:relative}
.stp{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.stp::before{content:"";position:absolute;left:30px;top:30px;bottom:0;width:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp .day{width:62px;text-align:center}
.stp .day b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto;border-radius:50%;background:var(--info-bg);color:var(--info);font-family:Archivo,sans-serif;font-size:13px;position:relative;z-index:1}
.stp .day span{font-size:11px;color:var(--ink-3);display:block;margin-top:2px;position:relative;z-index:1;background:var(--surface);padding:1px 0}
.stp .bd{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.stp .bd .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.stp .bd .h b{font-size:13.5px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.msg .sub{font-weight:600;display:block;margin-bottom:8px;white-space:normal}
mark.ai{background:var(--ai-bg);color:inherit;border-bottom:2px solid var(--ai);padding:0 2px;border-radius:2px}
mark.cs{background:var(--good-bg);color:inherit;border-bottom:2px solid var(--good-mk);padding:0 2px;border-radius:2px}
mark.vp{background:var(--info-bg);color:inherit;border-bottom:2px solid var(--info-mk);padding:0 2px;border-radius:2px}
mark.bad{background:var(--crit-bg);color:var(--crit);border-bottom:2px solid var(--crit-mk);padding:0 2px;border-radius:2px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.checks div{display:flex;gap:8px;align-items:flex-start}
.ck{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.ck.ok{background:var(--good-mk)}.ck.no{background:var(--crit-mk)}.ck.wa{background:var(--warn-mk);color:#1a1300}

/* sending timeline */
.day-track{position:relative;height:74px;border-radius:8px;background:var(--surface-2);margin-top:8px}
.win{position:absolute;top:10px;bottom:22px;background:var(--info-bg);border-radius:4px}
.tick{position:absolute;bottom:4px;font-size:10.5px;color:var(--ink-3);transform:translateX(-50%);font-family:"IBM Plex Mono",monospace}
.sd{position:absolute;top:22px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface-2)}
.now{position:absolute;top:4px;bottom:18px;width:2px;background:var(--ink)}
.now::after{content:"now";position:absolute;top:-2px;left:5px;font-size:10px;font-weight:600}
.health{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hc{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.hc .k{font-size:11.5px;color:var(--ink-3);font-weight:600}
.hc .v{font-size:17px;font-weight:600;font-family:Archivo,sans-serif;margin:2px 0}

/* kanban */
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 2px 6px;border-bottom:3px solid var(--line)}
.col-h b{font-size:13px}
.col-h .num{font-size:12px;color:var(--ink-3)}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.opp .nm{font-weight:600;font-size:13px}
.opp .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.opp.fresh{box-shadow:0 0 0 2px var(--good-mk)}

/* inbox */
.reply{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.reply:last-child{border-bottom:0}
.reply .who{font-weight:600}
.reply .q{font-size:13px;color:var(--ink-2);margin-top:3px}
.reply .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sla{font-size:11.5px;font-family:"IBM Plex Mono",monospace}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:"IBM Plex Mono",monospace}
.chart .grid-l{stroke:var(--line-soft);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.funnel{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.fr .bar{height:22px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.fr .bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.fr .v{font-size:12.5px;text-align:right}
.fr .v span{color:var(--ink-3)}

/* derived alerts: the page's colour-coded "what is going on" */
function alerts(){
  const a = [];
  const open = replies.filter(r => !r.handled && (r.cls==="Interested"||r.cls==="Referral"));
  open.forEach(r => { const [ct,co] = ctById(r.ct); a.push({tone: slaTone(r.mins)==="crit"?"crit":"good", ic:"!", t:`${r.cls} reply from ${co.name}`, m:`${ct.first} ${ct.last} · ${ct.role} · waiting ${slaTxt(r.mins)} · respond within 2h`, go:"engagement"}); });
  const bounced = companies.filter(c => c.outreach==="Bounced");
  if (bounced.length) a.push({tone:"crit",ic:"×",t:`${bounced.length} hard bounce held · contact removed from sequence`,m:bounced.map(c=>c.name).join(", ")+" · re-validate before any resend",go:"companies"});
  const err = opps.filter(o => o.crm==="error");
  if (err.length) a.push({tone:"crit",ic:"⟳",t:`${err.length} opportunity failed to sync to CRM`,m:err.map(o=>o.id+" · "+coById(o.co).name).join(", "),go:"opportunities"});
  const due = companies.filter(c => c.outreach==="Follow-up due");
  if (due.length) a.push({tone:"warn",ic:"↻",t:`Repeat business: ${due.length} past client due a follow-up`,m:due.map(c=>`${c.name} · last contact ${c.prior.lastContact}`).join(", "),go:"companies"});
  const catchall = companies.flatMap(c=>c.contacts.filter(k=>k.email==="catch-all").map(k=>c.name));
  if (catchall.length) a.push({tone:"warn",ic:"?",t:`${catchall.length} catch-all address not enrolled`,m:"Catch-all domains cannot be verified. Sent only after LinkedIn confirmation.",go:"companies"});
  const autoT = tasks.filter(t=>t.by==="system"&&t.src&&t.reenrol);
  autoT.forEach(t=>a.push({tone:"info",ic:"↻",t:`Relance scheduled for ${coById(t.co).name}`,m:`From a “Not now” reply · email ${fmtD(parseD(t.due))} · sequence resumes ${fmtD(parseD(t.reenrol))}`,go:"tasks"}));
  companies.filter(c=>opps.some(o=>o.co===c.id&&!["Won","Lost"].includes(o.stage))&&!canBill(c)).forEach(c=>{const o=opps.find(o=>o.co===c.id&&!["Won","Lost"].includes(o.stage)); a.push({tone:"crit",ic:"€",t:`${o.id} at ${c.name} cannot be invoiced`,m:`${o.stage} · ${eurk(o.value)} · ${billBlocker(c)}`,go:"accounts"});});
  const od = tasks.filter(t=>t.status==="open"&&daysTo(t.due)<0);
  if (od.length) a.push({tone:"crit",ic:"!",t:`${od.length} follow-up task overdue`,m:od.map(t=>coById(t.co).name+" · "+t.title).join(", "),go:"tasks"});
  if (send.sentToday/send.cap > .6) a.push({tone:"info",ic:"i",t:`Sending at ${send.sentToday}/${send.cap} of today's warm-up cap`,m:`${send.queued} queued in the afternoon window · bounce rate ${send.bounceRate}% (pause at 3%)`,go:"sending"});
  return a;
}

/* ---- Sequences & AI ---- */
let seqSel = "SEQ-A", prevCo = "CO-1041", prevTone = "auto", prevStep = 0, draftEdit = null;
function buildMessage(c, ct, seq, stepIdx, tone){
  const t = TONES[tone==="auto"?c.tone:tone];
  const step = seq.steps[stepIdx];
  const hasHistory = c.prior.placements>0 || !!c.prior.lastContact;
  const sig = c.signals[0];
  const intro = hasHistory && c.prior.placements
    ? `It has been a few months since we placed ${c.prior.placements===1?"a consultant":"two engineers"} with your team, and I noticed you are hiring again.`
    : `I noticed ${c.name} currently has ${sig.toLowerCase().replace(/ · .*/,"")} advertised${c.signals[1]?`, shortly after the news that the company ${c.signals[1].toLowerCase().includes("cto")?"appointed a new CTO":"is growing"}`:""}.`;
  const pain = `Roles like these in ${c.city} often stay open for weeks because the ${c.stack[0]} market is thin.`;
  const sub = stepIdx===0 ? `${c.signals[0].replace(/ · .*/,"")} at ${c.name}` : stepIdx===3 ? `A different idea for ${c.name}` : `Re: ${c.name} hiring`;
  let body = `${t.g} ${ct.first},\n\n`;
  body += `<mark class="ai">${esc(intro)}</mark>\n\n`;
  if (step.blocks.some(b=>b.includes("pain"))||stepIdx===0) body += `<mark class="ai">${esc(pain)}</mark> `;
  body += `<mark class="vp">${esc(VALUE[c.segment])}</mark>\n\n`;
  if (step.blocks.some(b=>b.toLowerCase().includes("case"))||stepIdx===2) body += `One recent example: <mark class="cs">${esc(CASES[c.desk]||CASES["Brussels IT Dev"])}</mark>.\n\n`;
  body += `${t.cta}\n\n${t.close},\nThe Zig\n\n<span class="muted" style="font-size:12px">You are receiving this because your role matches B2B services we offer. Reply "stop" and we will not contact you again.</span>`;
  return {sub, body, hasHistory};
}
function complianceChecks(html, c){
  const plain = html.replace(/<[^>]+>/g,"").toLowerCase();
  const hasHistory = c.prior.placements>0 || !!c.prior.lastContact;
  const fake = FAKE_FAMILIARITY.filter(p=>plain.includes(p));
  return [
    [fake.length && !hasHistory ? "no" : "ok", fake.length && !hasHistory ? `Implies prior contact that never happened: “${fake.join("”, “")}”. Blocked from sending.` : "No implied prior contact. Claims only what the CRM knows."],
    [plain.includes("stop") ? "ok" : "no", "Opt-out line present (B2B legitimate interest, GDPR Art. 6(1)(f))"],
    [/guarantee|100%|best in/.test(plain) ? "wa" : "ok", /guarantee|100%|best in/.test(plain) ? "Absolute claim found. Soften it." : "No absolute or unverifiable claims"],
    [plain.length < 1400 ? "ok" : "wa", `Length ${plain.length} characters${plain.length<1400?" · under 1,400":" · shorten"}`],
    [c.contacts.some(k=>k.email==="valid") ? "ok" : "no", "Recipient address validated"],
  ];
}
function vSequences(){
  const seq = sequences.find(s=>s.id===seqSel);
  const c = coById(prevCo); const ct = c.contacts.find(k=>k.email==="valid") || c.contacts[0];
  const msg = buildMessage(c, ct, seq, prevStep, prevTone);
  const bodyHTML = draftEdit!=null ? esc(draftEdit).replace(new RegExp("("+FAKE_FAMILIARITY.join("|")+")","gi"),'<mark class="bad">$1</mark>') : msg.body;
  const checks = complianceChecks(draftEdit!=null?draftEdit:msg.body, c);
  const blocked = checks.some(x=>x[0]==="no");
  const cos = companies.filter(x=>x.contacts.length);

    "Each sequence is a set of timed steps. AI writes the company-specific lines; value propositions and case studies come from an approved library. Any reply stops the sequence.") +

      <div class="panel"><h3 style="font-size:14px;margin-bottom:8px">Follow-up logic</h3>
        <div class="checks">
          <div><span class="ck ok">✓</span>Reply of any kind → sequence stops for the whole company</div>
          <div><span class="ck ok">✓</span>Interested reply → opportunity created, CRM push</div>
          <div><span class="ck wa">↻</span>No open after 2 steps → AI rewrites subject and tone</div>
          <div><span class="ck wa">↻</span>Opened, no reply → case-study step brought forward</div>
          <div><span class="ck ok">✓</span>Out-of-office with a date → follow-up generated for the next working day; named contacts added to the CRM</div>
          <div><span class="ck no">×</span>Hard bounce → contact removed, domain checked</div>
        </div></div>
    </div>
    <div class="stack">
      <div class="panel"><div class="panel-head"><h3>${esc(seq.name)}</h3><span class="sub">${seq.steps.length} steps · ${seq.steps[seq.steps.length-1].d} days</span></div>
        <div class="steps">${seq.steps.map((s,i)=>`<div class="stp"><div class="day"><b>D${s.d}</b><span>${s.ch}</span></div><div class="bd" style="${i===prevStep?"border-color:var(--info-mk)":""}"><div class="h"><b>${esc(s.nm)}</b><span>${s.cond?pill("warn",s.cond):""} <button class="btn sm ghost" data-step="${i}">${i===prevStep?"Previewing":"Preview"}</button></span></div><div class="chips" style="margin-top:6px">${s.blocks.map(b=>`<span class="chip" style="${/AI|Tone/.test(b)?"background:var(--ai-bg);color:var(--ai);border-color:transparent":/Case/.test(b)?"background:var(--good-bg);color:var(--good);border-color:transparent":/Value/.test(b)?"background:var(--info-bg);color:var(--info);border-color:transparent":""}">${esc(b)}</span>`).join("")}<span class="chip">stops on reply</span></div></div></div>`).join("")}</div>
      </div>
      <div class="panel"><div class="panel-head"><h3>Personalised preview</h3>
        <div class="toolbar" style="margin:0">
          <label class="f">Company<select id="pv-co">${cos.map(x=>`<option value="${x.id}" ${x.id===prevCo?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
          <label class="f">Tone<select id="pv-tone">${["auto","corporate","startup","agency","mirror"].map(t=>`<option value="${t}" ${t===prevTone?"selected":""}>${t==="auto"?"Auto ("+c.tone+")":t==="mirror"?"Mirror reply style":t}</option>`).join("")}</select></label>
        </div></div>
        <div class="chips" style="margin-bottom:10px;font-size:12px"><span><mark class="ai">AI line</mark></span><span><mark class="vp">Value proposition</mark></span><span><mark class="cs">Case study</mark></span><span><mark class="bad">Blocked phrase</mark></span></div>
        <div class="msg"><span class="sub">Subject: ${esc(msg.sub)}</span><span class="muted" style="font-size:12px">To: ${esc(ct.first+" "+ct.last)} · ${esc(ct.role)} · ${esc(c.name)}</span>\n\n${bodyHTML}</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn" data-act="edit">${draftEdit!=null?"Reset to AI draft":"Edit draft"}</button>
          <button class="btn" data-act="tryfake">Test: add “as discussed”</button>
          <button class="btn ${blocked?"":"good"}" data-act="approve" ${blocked?"disabled style='opacity:.55;cursor:not-allowed'":""}>${blocked?"Blocked · fix checks":"Approve step"}</button>
        </div>
        ${draftEdit!=null?`<label class="f" style="margin-top:10px">Edit (plain text)<textarea id="draft" rows="9">${esc(draftEdit)}</textarea></label>`:""}
        <div class="hr"></div>
        <h4 style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px">Pre-send checks</h4>
        <div class="checks">${checks.map(([k,t])=>`<div><span class="ck ${k}">${k==="ok"?"✓":k==="no"?"×":"!"}</span><span>${esc(t)}</span></div>`).join("")}</div>
      </div>
    </div>
  </div>`;
}

/* ---- Sending ---- */
function vSending(){
  const start = 7*60, end = 18*60, W = end-start, pos = m => (100*(m-start)/W);
  const wins = [[8*60+40,11*60+30],[13*60+30,16*60+15]];
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const now = 14*60+5; const dots = [];
  for (let i=0;i<38;i++){ const w = wins[i<22?0:1]; const m = w[0] + rnd()*(w[1]-w[0]); dots.push(m); }
  dots.sort((a,b)=>a-b);
  const heldIdx = [24,25];
  return head("Step 5 · sending engine","Sending engine",
    "Sends are spread across two randomised windows per mailbox, capped by the warm-up schedule, and paused automatically when bounces or complaints rise.") +
  `<div class="health" style="margin-bottom:16px">
    <div class="hc"><div class="k">Domain reputation</div><div class="v" style="color:var(--good)">${send.reputation}</div>${pill("good","SPF · DKIM · DMARC pass")}</div>
    <div class="hc"><div class="k">Hard bounce rate · 7d</div><div class="v num">${send.bounceRate}%</div>${pill(send.bounceRate>=3?"crit":send.bounceRate>=2?"warn":"good",send.bounceRate>=3?"Paused":"Pause at 3%")}</div>
    <div class="hc"><div class="k">Spam complaints · 7d</div><div class="v num">${send.complaint}%</div>${pill("good","Limit 0.1%")}</div>
    <div class="hc"><div class="k">Warm-up</div><div class="v num">Day ${send.warmDay}</div>${pill("info","Cap rises +2/day to 50")}</div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Today's send windows</h3><span class="sub">each dot is one email · jitter ± 7 min, never two within 90 s</span></div>
    <div class="day-track" role="img" aria-label="Send schedule for today, ${send.sentToday} sent, ${send.queued} queued, ${send.held} held">
      ${wins.map(w=>`<div class="win" style="left:${pos(w[0])}%;width:${pos(w[1])-pos(w[0])}%"></div>`).join("")}
      ${dots.map((m,i)=>{const st = heldIdx.includes(i)?"crit":m<now?"good":"info"; return `<span class="sd" style="left:${pos(m)}%;background:var(--${st}-mk)" data-tip="${String(Math.floor(m/60)).padStart(2,"0")}:${String(Math.floor(m%60)).padStart(2,"0")} · ${st==="good"?"sent":st==="crit"?"held: catch-all":"scheduled"}"></span>`}).join("")}
      <span class="now" style="left:${pos(now)}%"></span>
      ${[8,10,12,14,16,18].map(h=>`<span class="tick" style="left:${pos(h*60)}%">${h}:00</span>`).join("")}
    </div>
    <div class="chips" style="margin-top:10px;gap:14px;font-size:12px;color:var(--ink-2)"><span><span class="dot good"></span> Sent</span><span><span class="dot info"></span> Scheduled</span><span><span class="dot crit"></span> Held</span><span><span style="display:inline-block;width:14px;height:9px;background:var(--info-bg);border-radius:2px"></span> Send window</span></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><div class="panel-head"><h3>Mailboxes</h3><span class="sub">2 half-time recruiters</span></div>
      ${send.mailboxes.map(m=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>${m.nm}</b><span class="num">${m.sent} / ${m.cap}</span></div><div class="meter"><i style="width:${100*m.sent/m.cap}%"></i></div><div class="note">Warm-up ${m.warm}</div></div>`).join("")}
    </div>
    <div class="panel"><div class="panel-head"><h3>Protection rules</h3></div>
      <div class="stack" style="gap:10px">
        <label class="f">Daily cap per mailbox<input type="number" id="cap" value="${send.cap/2}" min="5" max="50"></label>
        <div class="checks">
          <div><span class="ck ok">✓</span>Validate every address before first send; catch-all held until LinkedIn confirms</div>
          <div><span class="ck ok">✓</span>Pause mailbox if hard bounces ≥ 3% over the last 50 sends</div>
          <div><span class="ck ok">✓</span>Pause all sending if complaints ≥ 0.1% or a blocklist hit</div>
          <div><span class="ck ok">✓</span>Max 2 contacts per company per day; never the same person twice in 72 h</div>
          <div><span class="ck ok">✓</span>Local business hours of the recipient only (BE, LU, FR); no weekends</div>
        </div>
      </div></div>
  </div>`;
}

function barChart(){
  const W=640,H=200,P={l:34,r:10,t:12,b:26}, max=50, bw=(W-P.l-P.r)/send.daily.length;
  const y = v => P.t + (H-P.t-P.b)*(1-v/max);
  let g = "";
  [0,10,20,30,40,50].forEach(v=>{ g += `<line class="grid-l" x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
  send.daily.forEach((v,i)=>{ const x = P.l+i*bw+3, w = bw-6; const last = i===send.daily.length-1;
    if (v) g += `<path d="M${x},${y(0)} V${y(v)+4} q0,-4 4,-4 h${w-8} q4,0 4,4 V${y(0)} Z" fill="${last?"var(--s1)":"var(--seq-1)"}" data-tip="${DAYS[i]}${i?" Sep":""}: ${v} sent"/>`;
    else g += `<text x="${x+w/2}" y="${y(0)-4}" text-anchor="middle" style="font-size:9px">wknd</text>`;
    if (i%2===0 || last) g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${DAYS[i].replace(" Sep","")}</text>`;
    if (last) g += `<text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${v}</text>`;
  });
  g += `<line class="base" x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  g += `<line x1="${P.l}" x2="${W-P.r}" y1="${y(40)}" y2="${y(40)}" stroke="var(--warn-mk)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-P.r}" y="${y(40)-5}" text-anchor="end" style="fill:var(--warn)">cap 40</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Outreaches per working day, last two weeks, rising from 18 to 36 against a cap of 40">${g}</svg>`;
}

  return `<div class="rng" role="img" aria-label="Market ${f(m.band[0])} to ${f(m.band[1])}, median ${f(m.median)}, ${m.budgetLbl}">
    <div class="rng-t"><span class="rng-b" style="left:${x(m.band[0])}%;width:${x(m.band[1])-x(m.band[0])}%"></span><span class="rng-m" style="left:${x(m.median)}%"></span><span class="rng-g ${under?"crit":"good"}" style="left:${x(m.budget)}%"></span></div>
    <div class="rng-l"><span style="left:${x(m.band[0])}%">${f(m.band[0])}</span><span style="left:${x(m.median)}%;font-weight:600;color:var(--ink)">median ${f(m.median)}</span><span style="left:${x(m.band[1])}%">${f(m.band[1])}</span></div>

}

    <div class="seg" role="group" aria-label="Direction">${[["all","All"],["out","Sent"],["in","Received"],["scheduled","Scheduled"]].map(([k,l])=>`<button data-mdir="${k}" aria-pressed="${mf.dir===k}">${l}</button>`).join("")}</div>
    <select id="mf-co" aria-label="Company"><option value="all">All companies</option>${companies.filter(c=>mails.some(m=>m.co===c.id)).map(c=>`<option value="${c.id}" ${mf.co===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    <select id="mf-kind" aria-label="Type"><option value="all">All types</option>${kinds.map(k=>`<option ${mf.kind===k?"selected":""}>${esc(k)}</option>`).join("")}</select>
    <input type="text" id="mf-q" placeholder="Search subject or text" value="${esc(mf.q)}" aria-label="Search emails">
    <span class="note">${L.length} email${L.length===1?"":"s"}</span>
  </div>
  ${mailTable(mailSort(L))}`;
}
function openMail(id){
  const m = mails.find(x=>x.id===id), [ct] = ctById(m.ct), co = coById(m.co);
  const thread = mailSort(mails.filter(x=>x.ct===m.ct)).reverse();
  drawer(`
    <div class="eyebrow">${m.id} · ${esc(m.kind)}</div>
    <h3 style="margin:4px 0 8px">${esc(m.sub)}</h3>
    <div class="chips" style="margin-bottom:12px"><span class="dir ${m.dir}">${m.dir==="out"?"↗ Sent":"↙ Received"}</span>${mailStatus(m)}</div>
    <dl class="dl"><dt>${m.dir==="out"?"To":"From"}</dt><dd>${esc(ct.first+" "+ct.last)} · ${esc(ct.role)}, ${esc(co.name)}</dd><dt>${m.dir==="out"?"Sent by":"Received by"}</dt><dd>${esc(m.dir==="out"?m.by:"Recruiter inbox")}</dd><dt>When</dt><dd class="num">${fmtD(parseD(m.d))} ${parseD(m.d).getFullYear()} · ${m.t}</dd>${m.dir==="out"&&m.st!=="scheduled"?`<dt>Engagement</dt><dd>${m.o} open${m.o===1?"":"s"} · ${m.c} click${m.c===1?"":"s"}</dd>`:""}</dl>
    ${m.body?`<div class="sect"><h4>Message</h4><div class="msg">${esc(m.body)}</div></div>`:""}
    <div class="sect"><h4>Thread with ${esc(ct.first)} · ${thread.length} emails</h4>
      <div class="tl">${thread.map(x=>`<button class="tl-i" data-mail="${x.id}" style="border:0;background:${x.id===m.id?"var(--info-bg)":"none"};text-align:left;padding:4px;border-radius:6px;width:100%"><span class="dot ${x.dir==="in"?"good":x.st==="scheduled"?"ai":x.st==="bounced"?"crit":"info"}"></span><span class="num tl-d">${fmtD(parseD(x.d))}</span><div><b style="font-weight:600">${x.dir==="in"?"↙ ":"↗ "}${esc(x.sub)}</b><div class="note">${esc(x.kind)} · ${x.dir==="in"?esc(x.st):esc(MST[x.st][1])}</div></div></button>`).join("")}</div></div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-co="${co.id}">Open company</button><button class="btn ghost" data-mailco="${co.id}">All emails with ${esc(co.name)}</button></div>`);
}
/* ---------------- render & events ---------------- */
function render(){
  renderNav();
  const m = {emails:vEmails,reports:vReports,accounts:vAccounts,tasks:vTasks,today:vToday,companies:vCompanies,sequences:vSequences,sending:vSending,engagement:vEngagement,opportunities:vOpps,analytics:vAnalytics,workflow:vWorkflow,model:vModel}[view];
  $("#main").innerHTML = m();
  ["#seqgrid","#repgrid"].forEach(id=>{ const sg = $(id); if (sg && innerWidth < 900) sg.style.gridTemplateColumns = "minmax(0,1fr)"; });
}
function drawer(html){
  $("#layer").innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Details"><button class="x" data-close aria-label="Close">×</button>${html}</aside>`;
  $(".drawer .x").focus();
}
function closeDrawer(){ $("#layer").innerHTML = ""; }

function createOpp(r){
  const [ct,co] = ctById(r.ct);
  const id = "OP-" + (310 + opps.length);
  if (opps.some(o=>o.co===co.id && !["Won","Lost"].includes(o.stage))) { r.handled = true; r.done = "linked to the open opportunity"; toast("Reply linked to the open opportunity for "+co.name); return; }
  opps.unshift({id,co:co.id,ct:ct.id,stage:"New",type:co.segment===1?"Subcontract":"Freelance",value:FREELANCE_YR,notes:"From reply: “"+r.text+"”",crm:"synced",age:"now"});
  r.handled = true; r.done = "opportunity "+id+" created, sequence stopped, pushed to CRM";
  co.outreach = "Stopped"; co.opp = "New"; ct.score = Math.min(100, ct.score+40);
  freshOpp = id;
  tasks.filter(t=>t.ct===ct.id && t.type==="Reply").forEach(t=>t.status="done");
  toast(`${id} created · sequence stopped for ${co.name} · pushed to CRM`);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-co],[data-mail],[data-close]"); if (!t) return;
  const d = t.dataset;
  if ("close" in d) return closeDrawer();
  if (d.v) return go(d.v);
  if (d.go) { closeDrawer(); return go(d.go); }
  if (d.co) return openCompany(d.co);
  if (d.cof) { coFilter = d.cof; return render(); }
  if (d.cos) { coSort = d.cos; return render(); }
  if (d.seq) { seqSel = d.seq; prevStep = 0; draftEdit = null; return render(); }
  if (d.step) { prevStep = +d.step; draftEdit = null; return render(); }
  if (d.preview) { prevCo = d.preview; draftEdit = null; closeDrawer(); const c = coById(d.preview); const s = c.contacts.find(k=>k.seq); if (s) seqSel = s.seq; return go("sequences"); }
  if (d.enrol) { const c = coById(d.enrol); c.outreach = "In sequence"; c.contacts.filter(k=>k.email==="valid").forEach(k=>k.seq = c.segment===1?"SEQ-B":c.prior.placements?"SEQ-C":"SEQ-A"); closeDrawer(); toast(`${c.name} enrolled · first send in the next window`); return render(); }
  if (d.copy) { const txt = $("#"+d.copy).textContent; try { navigator.clipboard.writeText(txt).then(()=>toast("Search copied"),()=>selectText(d.copy)); } catch(err){ selectText(d.copy); } return; }
  if (d.astep) { const [cid,i] = d.astep.split(":"); const c = coById(cid); c.acct.done[+i] = c.acct.done[+i]?0:1; if (!c.acct.since) c.acct.since = iso(TODAY); render(); openCompany(cid); toast(acctN(c)===5?`${c.name}: supplier account open`:`${c.name}: account ${acctN(c)}/5`); return; }
  if (d.psl) { const c = coById(d.psl); c.acct.psl.member = !c.acct.psl.member; if (c.acct.psl.member) c.acct.psl.renew = iso(addDays(TODAY,365)); render(); openCompany(d.psl); toast(c.acct.psl.member?`${c.name}: listed as preferred supplier`:`${c.name}: removed from PSL`); return; }
  if (d.mail) { return openMail(d.mail); }
  if (d.mailco) { mf = {dir:"all",co:d.mailco,kind:"all",q:""}; closeDrawer(); return go("emails"); }
  if (d.mdir) { mf.dir = d.mdir; return render(); }
  if (d.flex) { const [bid,i] = d.flex.split(":"); const b = briefs.find(x=>x.id===bid); b.flex[+i].on = !b.flex[+i].on; const rt = tasks.find(t=>t.brief===bid && t.status!=="done"); if (rt) rt.draft = reportDraft(b); return render(); }
  if (d.brief) { brSel = d.brief; return render(); }
  if (d.task) { return openTask(d.task); }
  if (d.tsort) { tSort = d.tsort; return render(); }
  if (d.relance) { const t = createRelance(replies.find(r=>r.id===d.relance), false); toast(`${t.id}: relance on ${fmtD(parseD(t.due))} · sequence paused`); return render(); }
  if (d.tdo) { completeTask(tasks.find(x=>x.id===d.tdo)); closeDrawer(); return render(); }
  if (d.tstop) { const t = tasks.find(x=>x.id===d.tstop); mails = mails.filter(m=>!(m.st==="scheduled"&&m.ct===t.ct&&m.d===t.due)); t.status = "done"; t.act = "Stopped: "+t.act; closeDrawer(); toast("Stopped. That email will not send."); return render(); }
  if (d.town) { tOwn = d.town; return render(); }
  if (d.tapprove) { const t = tasks.find(x=>x.id===d.tapprove); const fut = daysTo(t.due)>0; if (!fut) t.status="done"; else t.status="scheduled"; t.approved=true; closeDrawer(); toast(fut?`${t.id} approved · sends ${fmtD(parseD(t.due))} in the morning window`:`${t.id} done`); return render(); }
  if (d.tsnooze) { const t = tasks.find(x=>x.id===d.tsnooze); t.due = iso(addDays(parseD(t.due)<TODAY?TODAY:parseD(t.due),7)); closeDrawer(); toast(`${t.id} moved to ${fmtD(parseD(t.due))}`); return render(); }
  if (d.opp) { createOpp(replies.find(r=>r.id===d.opp)); return render(); }
  if (d.handle) { const r = replies.find(x=>x.id===d.handle); r.handled = true; r.done = CLS_ACTION[r.cls].toLowerCase(); const [ct,co] = ctById(r.ct); if (r.cls==="Unsubscribe") { ct.seq = null; ct.email = ct.email; } toast(`${co.name}: ${CLS_ACTION[r.cls]}`); return render(); }
  if (d.mv) { const o = opps.find(x=>x.id===d.mv); const i = STAGES.indexOf(o.stage)+(+d.d); if (STAGES[i]==="Won" && !canBill(coById(o.co))) { toast(`Blocked: ${o.id} cannot be Won yet · ${billBlocker(coById(o.co))}`); return; } o.stage = STAGES[Math.max(0,Math.min(5,i))]; o.age="now"; coById(o.co).opp = o.stage; freshOpp = o.id; toast(`${o.id} → ${o.stage} · CRM updated${o.stage==="Negotiation"?" · negotiation workflow started":""}`); return render(); }
  if (d.retry) { const o = opps.find(x=>x.id===d.retry); o.crm = "synced"; toast(`${o.id} synced to CRM`); return render(); }
  if (d.act==="edit") { if (draftEdit!=null) draftEdit = null; else { const c = coById(prevCo); const ct = c.contacts.find(k=>k.email==="valid")||c.contacts[0]; draftEdit = buildMessage(c,ct,sequences.find(s=>s.id===seqSel),prevStep,prevTone).body.replace(/<[^>]+>/g,""); } return render(); }
  if (d.act==="tryfake") { const c = coById(prevCo); const ct = c.contacts.find(k=>k.email==="valid")||c.contacts[0]; const base = draftEdit ?? buildMessage(c,ct,sequences.find(s=>s.id===seqSel),prevStep,prevTone).body.replace(/<[^>]+>/g,""); draftEdit = base.replace(/,\n\n/, ",\n\nAs discussed, "); return render(); }
  if (d.act==="approve") { toast("Step approved · queued for the next send window"); return; }
  if (d.act==="import") { toast("Import accepts CSV or a CRM list: name, domain, country. Enrichment runs on arrival."); return; }
  if (d.act==="add") { toast("Manual entry: a company needs a name and a domain; the rest is enriched."); return; }
});
function selectText(id){ const r = document.createRange(); r.selectNodeContents($("#"+id)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected · press Ctrl+C to copy"); }
document.addEventListener("keydown", e => {
  if (e.key==="Escape") closeDrawer();
  if (e.key==="Enter" && e.target.matches("tr[data-co]")) openCompany(e.target.dataset.co);
  if (e.key==="Enter" && e.target.matches("tr[data-mail]")) openMail(e.target.dataset.mail);
});
document.addEventListener("change", e => {
  if (e.target.id==="mf-co") { mf.co = e.target.value; render(); }
  if (e.target.id==="mf-kind") { mf.kind = e.target.value; render(); }
  if (e.target.id==="pv-co") { prevCo = e.target.value; draftEdit = null; render(); }
  if (e.target.id==="pv-tone") { prevTone = e.target.value; draftEdit = null; render(); }
  if (e.target.id==="cap") { const v = Math.max(5,Math.min(50,+e.target.value||20)); send.cap = v*2; send.mailboxes.forEach(m=>m.cap=v); toast(`Cap set to ${v} per mailbox · ${v*2} a day`); render(); }
});
let draftTimer;
document.addEventListener("input", e => {
  if (e.target.id==="mf-q") { mf.q = e.target.value; clearTimeout(draftTimer); draftTimer = setTimeout(()=>{ const pos = e.target.selectionStart; render(); const q = $("#mf-q"); if (q){ q.focus(); q.setSelectionRange(pos,pos);} }, 300); }
  if (e.target.id==="draft") { draftEdit = e.target.value; clearTimeout(draftTimer); draftTimer = setTimeout(()=>{ const pos = e.target.selectionStart; render(); const ta = $("#draft"); if (ta){ ta.focus(); ta.setSelectionRange(pos,pos);} }, 500); }
});
/* hover tooltips on chart marks and send dots */
let tip;
document.addEventListener("pointerover", e => { const el = e.target.closest("[data-tip]"); if (!el) return; tip = document.createElement("div"); tip.className="tip"; tip.textContent = el.dataset.tip; document.body.appendChild(tip); });
document.addEventListener("pointermove", e => { if (tip) { tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY-30)+"px"; } });
document.addEventListener("pointerout", e => { if (tip && e.target.closest("[data-tip]")) { tip.remove(); tip = null; } });

createRelance(replies.find(r=>r.id==="RP-93"), true);
tasks = tasks.filter(t=>!["TK-406","TK-407"].includes(t.id));
processAutoReply(replies.find(r=>r.id==="RP-94"));
processAutoReply(replies.find(r=>r.id==="RP-92")); replies.find(r=>r.id==="RP-92").done += " · your task: send her the intro (TK-403)";
tasks.forEach(t=>{ if (/^(Dear|Hi) /.test(t.draft) && !/stop/i.test(t.draft)) t.draft += "\n\nReply \"stop\" and we will not contact you again."; });
[["RP-95","contact suppressed and logged for GDPR; never contacted again"]].forEach(([id,txt])=>{ const r = replies.find(x=>x.id===id); r.handled = true; r.auto = true; r.done = txt; const [ct] = ctById(r.ct); ct.seq = null; });
tasks.filter(t=>t.owner==="system"&&t.status!=="done"&&/^(Dear|Hi) /.test(t.draft||"")).forEach(t=>logMail(t,"scheduled"));
render();
})();
</script>
